services:
  postgres:
    image: postgres:16-alpine
    container_name: aims-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aims}
      POSTGRES_USER: ${POSTGRES_USER:-aims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aims}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aims-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aims} -d ${POSTGRES_DB:-aims}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aims-postgres-data:
