spring:
  application:
    name: aims-core
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aims}
    username: ${DB_USER:aims}
    password: ${DB_PASSWORD:aims}
  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

aims:
  metric:
    window-minutes: ${METRIC_WINDOW_MINUTES:1}
  rule:
    error-rate-threshold: ${RULE_ERROR_RATE_THRESHOLD:5.0}
    p95-latency-threshold-ms: ${RULE_P95_LATENCY_THRESHOLD_MS:2000}
    exception-count-threshold: ${RULE_EXCEPTION_COUNT_THRESHOLD:10}
